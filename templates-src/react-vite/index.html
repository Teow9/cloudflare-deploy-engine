<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{site_title}}</title>
  <script>document.documentElement.dataset.theme = '{{theme}}';</script>
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: #f8fafc; color: #0f172a; }
    html[data-theme='dark'] body { background: #0f172a; color: #e2e8f0; }
    .hero { min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; }
    .hero h1 { font-size: 3rem; margin: 0; }
    .hero .tagline { opacity: .7; }
    .badge { position: fixed; top: 12px; right: 12px; font-size: .72rem;
             padding: 4px 10px; border-radius: 999px; background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <span class="badge">React + Vite ⚛</span>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
