# CI 五线：语法 / Pester / ScriptAnalyzer / 无凭据扫描 / plugins.json schema
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: ① 语法检查（PSParser）
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\syntax-check.ps1

      - name: ⓪ 锁定 Pester 3.4（与引擎目标运行时 PS5.1 自带版本一致；runner 默认可能是 5.x）
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq '3.4.0' })) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: ② Pester 单元测试（tests 全目录 9 套件）
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script tests -EnableExit

      - name: ③ PSScriptAnalyzer（Error 级零容忍）
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          }
          Import-Module PSScriptAnalyzer
          $issues = Invoke-ScriptAnalyzer -Path scripts -Severity Error
          if ($issues.Count -gt 0) { $issues | Format-List; exit 1 }
          Write-Host "ScriptAnalyzer 通过：scripts 无 Error 级问题"

      - name: ④ 无凭据扫描（修正版，不再豁免 config/deploy）
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\check-no-secrets.ps1

      - name: ⑤ plugins.json schema 校验（四轴齐全 + handler 存在）
        run: |
          $reg = Get-Content plugins.json -Raw | ConvertFrom-Json
          foreach ($axis in @('sources','templates','ai','targets')) {
            if ($null -eq $reg.$axis) { Write-Error "缺少轴 $axis"; exit 1 }
          }
          foreach ($axis in @('sources','ai','targets')) {
            foreach ($entry in $reg.$axis) {
              if ($entry.handler -and -not (Test-Path $entry.handler)) {
                Write-Error "handler 不存在：$($entry.handler)"; exit 1
              }
            }
          }
          foreach ($entry in $reg.templates) {
            if (-not (Test-Path (Join-Path $entry.path 'template.json'))) {
              Write-Error "模板缺少 template.json：$($entry.path)"; exit 1
            }
          }
          Write-Host 'plugins.json schema 校验通过'

  # ⑥ 发布打包（理念尺寸门禁：exe ≤ 5MB / templates ≤ 3MB / zip ≤ 10MB）
  package:
    runs-on: windows-latest
    needs: windows
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖并拉取 Neutralino 运行时/客户端库
        run: |
          npm ci
          npx neu update

      - name: ⑥ 发布流水线（测试已在 windows 作业覆盖，此处仅构建 + 尺寸门禁 + 打包）
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\dev\build-release.ps1 -SkipTests

      - name: 上传分发物
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist\*.zip
            dist\SHA256.txt
            dist\size-report.json
          if-no-files-found: error