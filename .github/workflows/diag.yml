name: diag
on: workflow_dispatch

jobs:
  diag-windows:
    runs-on: windows-latest
    defaults: { run: { shell: powershell } }
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose hash/copy on runner
        run: |
          $src = Join-Path $env:TEMP ('site-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $src 'index.html'), '<h1>hi</h1>')
          Write-Host "TEMP=$env:TEMP"
          Write-Host "exists=$(Test-Path -LiteralPath (Join-Path $src 'index.html'))"
          $h = Get-FileHash -LiteralPath (Join-Path $src 'index.html') -Algorithm SHA256
          Write-Host "hash=[$($h.Hash)]  null=$($null -eq $h)"
          $f = @(Get-ChildItem -LiteralPath $src -Recurse -File)
          Write-Host "childCount=$($f.Count) firstLen=$($f.Count -gt 0 -and $f[0].Length)"
          . .\scripts\utils.ps1
          . .\scripts\config-manager.ps1
          . .\scripts\plugins\targets\target-pages.ps1
          $recs = @(New-FileRecords -SourceRoot $src)
          Write-Host "recs=$($recs.Count) rel=[$($recs[0].rel)] hash=[$($recs[0].hash)]"
          # 二进制拷贝复现
          $src2 = Join-Path $env:TEMP ('bin-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $src2 -Force | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $src2 'a.bin'), [byte[]](0x00,0x01,0x02))
          $out = Join-Path $env:TEMP ('out-' + [guid]::NewGuid())
          Copy-Item -LiteralPath (Join-Path $src2 'a.bin') -Destination (Join-Path $out 'a.bin')
          Write-Host "copyOut=$(Test-Path -LiteralPath (Join-Path $out 'a.bin'))"